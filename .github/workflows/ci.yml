name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        shell: pwsh
        run: python -m pip install -e ".[dev]"
      - name: Test
        shell: pwsh
        run: python -m pytest
